[project]
name = "example-worker"
version = "0.1.0"
description = "Template background worker."
requires-python = ">=3.12"
dependencies = [
  "example-shared",
  "redis>=5.0,<7.0",
]

[project.scripts]
worker-consumer = "example_worker.consumer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
